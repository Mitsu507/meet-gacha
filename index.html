<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b4a">
<title>약속 장소 가챠</title>
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --soft: #f3f4f6; --text: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --accent: #ff6b4a; --accent-soft: #ffe9e3; --ok: #16a34a; --shadow: 0 -6px 24px rgba(0,0,0,.12);
    --nav: calc(60px + env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --panel: #1b1e26; --soft: #252933; --text: #eceef2; --muted: #9aa0ab; --line: #2f3440; --accent-soft: #3a2621; --shadow: 0 -6px 24px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #map { position: fixed; inset: 0 0 var(--nav) 0; z-index: 0; }

  /* 상단 검색 (카카오맵처럼 입력하면 바로 목록) */
  .top { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 800; max-width: 616px; margin: 0 auto; }
  .bar { display: flex; gap: 8px; }
  .search { flex: 1; display: flex; background: var(--panel); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.15); overflow: hidden; }
  .search input { flex: 1; border: 0; padding: 13px 14px; font: inherit; background: transparent; color: var(--text); min-width: 0; outline: none; }
  .search button, .fab { border: 0; background: var(--panel); padding: 0 14px; }
  .fab { width: 46px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.15); font-size: 18px; }
  .results { margin-top: 8px; background: var(--panel); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18); overflow-y: auto; max-height: calc(100dvh - 90px - var(--nav) - env(safe-area-inset-top)); }
  .results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .results b { font-size: 15px; }
  .results .cat { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .results .addr { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .results .more { text-align: center; color: var(--accent); font-weight: 700; font-size: 14px; }

  /* 바텀시트: 손잡이를 끌어서 올리고 내림 */
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--nav); z-index: 600; background: var(--panel); border-radius: 20px 20px 0 0; box-shadow: var(--shadow); height: 48dvh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; transition: height .25s; }
  .sheet.dragging { transition: none; }
  .grab { flex: none; padding: 10px 0 8px; touch-action: none; cursor: grab; user-select: none; }
  .grab::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
  .grab .hint { display: block; text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .body { overflow-y: auto; padding: 0 18px 18px; flex: 1; }
  h2 { font-size: 19px; margin: 6px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .step { font-size: 12px; font-weight: 700; color: var(--accent); }
  .opts { display: grid; gap: 10px; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .opt { border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px; text-align: left; display: flex; gap: 12px; align-items: center; }
  .opt .em { font-size: 24px; }
  .opt b { display: block; font-size: 15px; }
  .opt small { color: var(--muted); font-size: 12px; }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .seg { display: flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 9px; font-size: 13px; }
  .seg button.on { background: var(--panel); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px; font-size: 13px; }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .chip.lock { opacity: .75; border-style: dashed; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 15px; background: var(--soft); }
  .btn.main { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; }
  .label { font-size: 13px; font-weight: 700; margin: 14px 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .pts { margin: 0 0 10px; padding: 0; list-style: none; font-size: 13px; }
  .pts li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .x { border: 0; background: none; color: var(--muted); }
  .stepper { display: inline-flex; align-items: center; gap: 14px; background: var(--soft); border-radius: 12px; padding: 4px; }
  .stepper button { border: 0; background: var(--panel); width: 36px; height: 36px; border-radius: 9px; font-size: 18px; }

  /* 결과 카드 */
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .card .hd { display: flex; gap: 10px; align-items: center; }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; }
  .card h3 { margin: 0; font-size: 16px; }
  .card .kind { color: var(--muted); font-size: 12px; }
  .why { margin: 10px 0; padding: 0; list-style: none; font-size: 13px; }
  .why li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
  .links { display: flex; gap: 6px; }
  .links a, .links button { flex: 1; text-align: center; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 4px; font-size: 12px; text-decoration: none; color: var(--text); white-space: nowrap; }
  .capsule { font-size: 64px; text-align: center; padding: 24px 0 8px; animation: shake .5s infinite; }
  @keyframes shake { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }

  /* 목록 화면 (친구/블랙리스트/설정) */
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item b { display: block; }
  input.txt { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; background: var(--panel); color: var(--text); }

  /* 하단 탭 */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 700; height: var(--nav); padding-bottom: env(safe-area-inset-bottom); background: var(--panel); border-top: 1px solid var(--line); display: flex; }
  nav button { flex: 1; border: 0; background: none; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  nav button span { font-size: 20px; }
  nav button.on { color: var(--accent); font-weight: 700; }

  /* 지도 위 핀 */
  .pin { background: var(--accent); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.35); cursor: pointer; }
  .start { background: #111; color: #fff; border: 2px solid #fff; border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .toast { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 900; background: rgba(20,20,20,.9); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; max-width: 90vw; }
  .setup { padding: 16px 18px; line-height: 1.6; font-size: 14px; }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="bar">
    <form class="search" id="searchForm">
      <input id="q" placeholder="장소, 역, 주소 검색" autocomplete="off" enterkeyhint="search">
      <button type="button" id="qClear" aria-label="지우기" hidden>✕</button>
      <button aria-label="검색">🔍</button>
    </form>
    <button class="fab" id="gps" aria-label="내 위치">📍</button>
  </div>
  <div class="results" id="results" hidden></div>
</div>

<section class="sheet" id="sheet">
  <div class="grab" id="grab"><span class="hint">끌어서 올리고 내리기</span></div>
  <div class="body" id="body"></div>
</section>

<nav>
  <button data-tab="gacha" class="on"><span>🎲</span>가챠</button>
  <button data-tab="friends"><span>👥</span>친구</button>
  <button data-tab="black"><span>🚫</span>블랙리스트</button>
  <button data-tab="settings"><span>⚙️</span>설정</button>
</nav>

<script src="logic.js"></script>
<script>
// 카카오 개발자 콘솔 > 앱 > 플랫폼 키 > JavaScript 키 (웹페이지 공개용, 등록한 도메인에서만 작동)
const KAKAO_JS_KEY = 'c2ea89f32c7ab02223e1f6f52bfae4b8';

// ---------- 저장소 (이 기기에만 저장) ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('mg_' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mg_' + k, JSON.stringify(v)); } catch {} },
};
let friends = store.get('friends', []);          // [{id, name, likes:[], dislikes:[]}]
let blacklist = store.get('black', []);          // [{id, name}]
let settings = Object.assign({ mode: 'transit', count: 4, rerolls: 3 }, store.get('settings', {}));

const TAG_NAMES = Object.keys(TAGS);
const DEFAULT_POS = { lat: 37.5665, lng: 126.978 }; // 서울시청

// ---------- 상태 ----------
const S = {
  tab: 'gacha', step: 'where',
  origin: DEFAULT_POS, originLabel: '서울시청 (기본)',
  multi: false, starts: [],             // 중간지점 모드 출발지
  who: null, people: 2, picked: new Set(), // 선택한 친구 id
  purpose: null, budget: null,
  today: new Set(), indoorOnly: false,
  cands: [], shown: [], seen: new Set(), rerollsLeft: 0,
};

// ---------- 공용 ----------
const $ = id => document.getElementById(id);
const $body = $('body'), sheet = $('sheet'), resultsEl = $('results');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}

// ---------- 바텀시트 높이 (접힘 / 반 / 전체) ----------
const SNAPS = { peek: () => 64, half: () => innerHeight * 0.48, full: () => innerHeight - 150 };
let snapName = 'half';
function snap(name) { snapName = name; sheet.style.height = SNAPS[name]() + 'px'; }
(() => {
  const grab = $('grab');
  let startY, startH, moved;
  grab.addEventListener('pointerdown', e => { startY = e.clientY; startH = sheet.offsetHeight; moved = false; grab.setPointerCapture(e.pointerId); sheet.classList.add('dragging'); });
  grab.addEventListener('pointermove', e => {
    if (startY == null) return;
    const dy = startY - e.clientY;
    if (Math.abs(dy) > 4) moved = true;
    sheet.style.height = Math.min(SNAPS.full(), Math.max(SNAPS.peek(), startH + dy)) + 'px';
  });
  grab.addEventListener('pointerup', () => {
    sheet.classList.remove('dragging');
    startY = null;
    if (!moved) return snap(snapName === 'peek' ? 'half' : 'peek'); // 탭하면 접기/펼치기
    const h = sheet.offsetHeight;
    snap(Object.keys(SNAPS).reduce((a, b) => Math.abs(SNAPS[a]() - h) < Math.abs(SNAPS[b]() - h) ? a : b));
  });
  addEventListener('resize', () => snap(snapName));
})();
snap('half');

// ---------- 카카오맵 SDK ----------
let map, ps, originMarker, radiusCircle, layer = [];
const LL = p => new kakao.maps.LatLng(p.lat, p.lng);
if (!KAKAO_JS_KEY) setupError('카카오 JavaScript 키가 아직 없어요.');
else {
  const sdk = document.createElement('script');
  sdk.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
  sdk.onload = () => kakao.maps.load(init);
  sdk.onerror = () => setupError('카카오맵을 불러오지 못했어요.');
  document.head.appendChild(sdk);
}
function setupError(msg) {
  $body.innerHTML = `<div class="setup"><h2>🗺️ 지도 준비 중</h2><p>${msg}</p><p class="muted">카카오 개발자 콘솔에서 JavaScript 키를 넣고, 이 주소(${esc(location.origin)})를 JavaScript SDK 도메인에 등록해야 해요.</p></div>`;
}

function init() {
  map = new kakao.maps.Map($('map'), { center: LL(DEFAULT_POS), level: 6 });
  ps = new kakao.maps.services.Places();
  const dot = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="12" fill="#2563eb" fill-opacity=".25"/><circle cx="13" cy="13" r="7" fill="#2563eb" stroke="#fff" stroke-width="3"/></svg>');
  originMarker = new kakao.maps.Marker({ map, position: LL(DEFAULT_POS), draggable: true, image: new kakao.maps.MarkerImage(dot, new kakao.maps.Size(26, 26), { offset: new kakao.maps.Point(13, 13) }) });
  radiusCircle = new kakao.maps.Circle({ map, center: LL(DEFAULT_POS), radius: 4000, strokeWeight: 1.5, strokeColor: '#ff6b4a', strokeOpacity: .9, fillColor: '#ff6b4a', fillOpacity: .06 });
  kakao.maps.event.addListener(originMarker, 'dragend', () => { const p = originMarker.getPosition(); setOrigin({ lat: p.getLat(), lng: p.getLng() }, '선택한 위치'); render(); });
  kakao.maps.event.addListener(map, 'click', e => {
    if (!resultsEl.hidden) return closeResults();
    if (S.tab !== 'gacha' || S.step !== 'where') return;
    const p = { lat: e.latLng.getLat(), lng: e.latLng.getLng() };
    if (S.multi) addStart(p, `출발지 ${S.starts.length + 1}`); else { setOrigin(p, '선택한 위치'); render(); }
  });
  setOrigin(DEFAULT_POS, S.originLabel);
  showPoint(DEFAULT_POS);
  render();
  locate(true);
}

function setOrigin(pos, label) {
  S.origin = pos; S.originLabel = label || S.originLabel;
  if (!map) return;
  originMarker.setPosition(LL(pos));
  radiusCircle.setPosition(LL(pos));
  radiusCircle.setRadius(TRAVEL[settings.mode].radius);
}
// 패널에 안 가리게, 보이는 지도 영역 가운데로
function showPoint(pos, level) {
  if (level) map.setLevel(level);
  map.setCenter(LL(pos));
  map.panBy(0, (SNAPS[snapName]() - 60) / 2); // 애니메이션 중일 수 있어 목표 높이 사용
}
function clearLayer() { layer.forEach(o => o.setMap(null)); layer = []; }
function overlay(pos, cls, text, onclick) {
  const el = document.createElement('div'); el.className = cls; el.textContent = text;
  if (onclick) el.onclick = onclick;
  layer.push(new kakao.maps.CustomOverlay({ map, position: LL(pos), content: el, yAnchor: .5, zIndex: 3 }));
}
function drawStarts() {
  S.starts.forEach((s, i) => overlay(s, 'start', i + 1));
  if (S.starts.length >= 2) S.starts.forEach(s => layer.push(new kakao.maps.Polyline({ map, path: [LL(s), LL(S.origin)], strokeWeight: 1.5, strokeColor: '#111', strokeStyle: 'dash' })));
}
function addStart(p, name) {
  if (S.starts.length >= 4) return toast('출발지는 최대 4곳까지');
  S.starts.push({ ...p, name });
  refreshStarts(); render();
}
function refreshStarts() {
  if (S.starts.length >= 2) setOrigin(midpoint(S.starts), '중간지점');
  clearLayer(); drawStarts();
}

function locate(silent) {
  if (!navigator.geolocation) { if (!silent) toast('이 기기는 위치를 지원하지 않아요'); return; }
  navigator.geolocation.getCurrentPosition(p => {
    const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (S.multi && S.step === 'where') addStart(pos, '내 위치');
    else { setOrigin(pos, '현재 위치'); showPoint(pos, 6); render(); }
  }, () => { if (!silent) toast('위치 권한이 없어요. 검색하거나 지도를 눌러 정해주세요'); }, { enableHighAccuracy: true, timeout: 8000 });
}
$('gps').onclick = () => map && locate(false);

// ---------- 위치 검색 (카카오 장소 검색, 입력하면 바로) ----------
let searchTimer, searchPage, lastQ = '', sheetBeforeSearch = null;
const qEl = $('q');
function openResults() {
  if (resultsEl.hidden && sheetBeforeSearch == null) { sheetBeforeSearch = snapName; snap('peek'); } // 목록이 패널에 안 가리게
  resultsEl.hidden = false;
}
function closeResults() {
  resultsEl.hidden = true;
  if (sheetBeforeSearch) snap(sheetBeforeSearch);
  sheetBeforeSearch = null;
}
function search(q, page = 1) {
  if (!ps || !q) return;
  lastQ = q;
  ps.keywordSearch(q, (data, status, pg) => {
    if (q !== lastQ) return;
    if (page === 1) resultsEl.innerHTML = '';
    resultsEl.querySelector('.more')?.remove();
    if (status !== kakao.maps.services.Status.OK) { if (page === 1) resultsEl.innerHTML = '<button disabled>검색 결과가 없어요</button>'; return openResults(); }
    data.forEach(d => {
      const b = document.createElement('button');
      const cat = (d.category_name || '').split(' > ').pop();
      b.innerHTML = `<b>${esc(d.place_name)}</b><span class="cat">${esc(cat)}</span><span class="addr">${esc(d.road_address_name || d.address_name)}</span>`;
      b.onclick = () => pickSearch({ lat: +d.y, lng: +d.x }, d.place_name);
      resultsEl.appendChild(b);
    });
    if (pg.hasNextPage) {
      const more = document.createElement('button'); more.className = 'more'; more.textContent = '결과 더보기';
      more.onclick = () => search(q, page + 1);
      resultsEl.appendChild(more);
    }
    openResults();
  }, { location: map.getCenter(), page, size: 15 });
}
function pickSearch(pos, name) {
  qEl.value = ''; $('qClear').hidden = true; closeResults(); qEl.blur();
  showPoint(pos, 5);
  if (S.tab === 'gacha' && S.step === 'where' && S.multi) return addStart(pos, name);
  setOrigin(pos, name);
  if (S.tab === 'gacha' && S.step !== 'result') S.step = 'where';
  render();
}
qEl.addEventListener('input', () => {
  const q = qEl.value.trim();
  $('qClear').hidden = !q;
  clearTimeout(searchTimer);
  if (!q) return closeResults();
  searchTimer = setTimeout(() => search(q), 250);
});
$('qClear').onclick = () => { qEl.value = ''; $('qClear').hidden = true; closeResults(); qEl.focus(); };
$('searchForm').onsubmit = e => { e.preventDefault(); clearTimeout(searchTimer); search(qEl.value.trim()); };

// ---------- 장소 데이터 (카카오 장소 검색) ----------
const cache = new Map();
// 키워드 하나를 최대 3페이지(45곳)까지
function searchKeyword(keyword, group, pos, radius) {
  return new Promise(resolve => {
    const all = [];
    const opts = { location: LL(pos), radius: Math.min(radius, 20000), size: 15 };
    if (group) opts.category_group_code = group;
    ps.keywordSearch(keyword, (data, status, pg) => {
      if (status === kakao.maps.services.Status.OK) all.push(...data);
      if (status === kakao.maps.services.Status.OK && pg.hasNextPage && pg.current < 3) pg.nextPage();
      else resolve(all);
    }, opts);
  });
}
async function fetchPlaces(purpose, pos, radius) {
  const key = [purpose, pos.lat.toFixed(4), pos.lng.toFixed(4), radius].join();
  if (cache.has(key)) return cache.get(key);
  const P = PURPOSES[purpose];
  const lists = await Promise.all(P.keywords.map(k => searchKeyword(k, P.group, pos, radius)));
  const byId = new Map();
  lists.flat().forEach(d => byId.set(d.id, toPlace(d)));
  const places = [...byId.values()];
  if (places.length) cache.set(key, places);
  return places;
}

// ---------- 화면 ----------
const opt = (key, val, em, title, sub) => `<button class="opt ${S[key] === val ? 'on' : ''}" data-set="${key}" data-val="${val}">${em ? `<span class="em">${em}</span>` : ''}<span><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span></button>`;

// 친구 + 오늘 필터에서 제외/선호 태그 모으기
function collectPrefs() {
  const excludes = [], likes = [];
  if (S.who === 'friends') for (const f of friends) if (S.picked.has(f.id)) {
    f.dislikes.forEach(tag => excludes.push({ tag, by: f.name }));
    f.likes.forEach(tag => likes.push({ tag, by: f.name }));
  }
  S.today.forEach(tag => excludes.push({ tag, by: '오늘' }));
  return { excludes, likes: likes.filter(l => !excludes.some(e => e.tag === l.tag)) };
}

const STEPS = ['where', 'who', 'purpose', 'budget', 'filter'];
const stepHead = (i, title, sub) => `<div class="step">STEP ${i}/5</div><h2>${title}</h2><p class="sub">${sub}</p>`;
const nav2 = (canNext, nextLabel = '다음') => `<div class="row"><button class="btn" data-go="back">이전</button><button class="btn main" data-go="next" ${canNext ? '' : 'disabled'}>${nextLabel}</button></div>`;

const VIEWS = {
  where() {
    const modeBtns = Object.entries(TRAVEL).map(([k, v]) => `<button class="${settings.mode === k ? 'on' : ''}" data-mode="${k}">${v.label}</button>`).join('');
    return stepHead(1, '어디 근처에서 만나요?', S.multi ? '지도를 누르거나 검색해서 친구들 출발지를 2~4곳 찍어주세요' : '위에서 검색하거나 📍, 지도를 눌러 위치를 정해주세요')
      + `<div class="seg"><button class="${!S.multi ? 'on' : ''}" data-multi="0">한 곳 기준</button><button class="${S.multi ? 'on' : ''}" data-multi="1">친구들 중간지점</button></div>`
      + (S.multi ? `<ul class="pts">${S.starts.map((s, i) => `<li>${i + 1}. ${esc(s.name)}<button class="x" data-rmstart="${i}">✕</button></li>`).join('') || '<li class="muted">아직 출발지가 없어요</li>'}</ul>` : `<p class="muted">📍 ${esc(S.originLabel)}</p>`)
      + `<div class="label">이동 거리</div><div class="seg">${modeBtns}</div>`
      + `<div class="row"><button class="btn main" data-go="next" ${S.multi && S.starts.length < 2 ? 'disabled' : ''}>여기서 찾을게요</button></div>`;
  },
  who() {
    let h = stepHead(2, '누구랑 가나요?', '친구를 등록해두면 취향이 자동으로 적용돼요')
      + `<div class="opts">${opt('who', 'solo', '', '혼자', '혼밥·혼놀')}${opt('who', 'date', '', '연인 / 데이트', '')}${opt('who', 'friends', '', '친구들', '여럿이서')}</div>`;
    if (S.who === 'friends') {
      h += `<div class="label">같이 가는 친구</div><div class="chips">`
        + (friends.map(f => `<button class="chip ${S.picked.has(f.id) ? 'on' : ''}" data-pick="${f.id}">${esc(f.name)}</button>`).join('') || '<span class="muted">등록된 친구가 없어요</span>')
        + `<button class="chip" data-tabgo="friends">＋ 친구 등록</button></div>`
        + `<div class="label">총 몇 명인가요? (나 포함)</div><div class="stepper"><button data-people="-1">−</button><b>${S.people}명</b><button data-people="1">＋</button></div>`;
    }
    return h + nav2(!!S.who);
  },
  purpose() {
    return stepHead(3, '오늘 모임의 주된 목적은?', '하나만 골라주세요')
      + `<div class="opts two">${opt('purpose', 'meal', '🍚', '든든한 밥', '식사')}${opt('purpose', 'cafe', '☕', '카페 / 디저트', '가볍게')}${opt('purpose', 'drink', '🍻', '술자리', '무드 있게')}${opt('purpose', 'play', '🎳', '놀거리', 'PC방·노래방·방탈출 등')}</div>` + nav2(!!S.purpose);
  },
  budget() {
    const play = S.purpose === 'play';
    return stepHead(4, '예산이나 스타일은 어때요?', '고른 쪽을 더 많이 뽑아줘요 (다른 곳도 섞여 나와요)')
      + `<div class="opts">${opt('budget', 'cheap', '💸', play ? '엔빵 부담 없게' : '가성비', play ? 'PC방·만화카페·보드게임·코인노래' : '부담 없는 가격')}`
      + `${opt('budget', 'normal', '🙂', play ? '다 같이 신나게' : '적당히', play ? '방탈출·볼링·스크린·VR' : '평소처럼')}`
      + `${opt('budget', 'special', '✨', play ? '오래 앉아 수다' : '특별한 날', play ? '룸카페·노래방·파티룸·영화' : '분위기 있게')}</div>` + nav2(!!S.budget);
  },
  filter() {
    const { excludes } = collectPrefs();
    const locked = new Map();
    excludes.filter(e => e.by !== '오늘').forEach(e => locked.set(e.tag, [...(locked.get(e.tag) || []), e.by]));
    const food = S.purpose === 'meal' || S.purpose === 'drink';
    return stepHead(5, food ? '오늘은 빼고 싶은 게 있나요?' : '마지막 확인', '없으면 바로 가챠!')
      + (food ? `<div class="chips">${TAG_NAMES.map(t => locked.has(t)
          ? `<span class="chip on lock">🔒 ${t}</span>`
          : `<button class="chip ${S.today.has(t) ? 'on' : ''}" data-today="${t}">${t}</button>`).join('')}</div>`
          + (locked.size ? `<p class="muted">🔒 친구 설정으로 자동 제외: ${esc([...locked].map(([t, by]) => `${t}(${by.join('·')})`).join(', '))}</p>` : '') : '')
      + `<div class="chips"><button class="chip ${S.indoorOnly ? 'on' : ''}" data-indoor>☔ 실내만 (비·추운 날)</button></div>`
      + `<div class="row"><button class="btn" data-go="back">이전</button><button class="btn main" data-go="roll">🎲 가챠 돌리기</button></div>`;
  },
  loading() { return '<div class="capsule">🎁</div><p class="sub" style="text-align:center">근처 장소를 뒤지는 중...</p>'; },
  result() {
    if (!S.shown.length) return `<h2>조건에 맞는 곳이 없어요 😢</h2><p class="sub">지금 시간에 문 연 곳이 없거나 조건이 너무 많아요. 이동 거리를 늘리거나 제외 조건을 줄여보세요.</p><div class="row"><button class="btn" data-go="filter">조건 바꾸기</button><button class="btn main" data-go="restart">처음부터</button></div>`;
    return `<h2>🎉 오늘의 후보 ${S.shown.length}곳</h2><p class="sub">지금 영업 시간대인 근처 ${S.total}곳 중에서 뽑았어요 · 남은 후보 ${S.cands.length}곳</p>`
      + S.shown.map((c, i) => {
        const p = c.place, cat = p.category.split(' > ').slice(-1)[0];
        return `<div class="card" data-focus="${i}"><div class="hd"><span class="num">${i + 1}</span><div><h3>${esc(p.name)}</h3><span class="kind">${esc(cat)} · ${(c.dist / 1000).toFixed(1)}km · ${esc(p.address)}</span></div></div>`
          + `<ul class="why">${c.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>`
          + `<div class="links"><a href="${esc(p.url)}" target="_blank" rel="noopener">⭐ 후기·사진</a><a href="https://map.kakao.com/link/to/${p.id}" target="_blank" rel="noopener">🧭 길찾기</a><button data-ban="${i}">🚫 안 가</button></div></div>`;
      }).join('')
      + `<div class="row"><button class="btn" data-go="restart">처음부터</button><button class="btn main" data-go="reroll" ${S.rerollsLeft > 0 && S.cands.length ? '' : 'disabled'}>🔄 다시 뽑기 (${S.rerollsLeft}/${settings.rerolls})</button></div>`;
  },
};

const TABS = {
  friends() {
    return `<h2>👥 친구 취향</h2><p class="sub">한 번 등록하면 "누구랑?"에서 이름만 골라도 취향이 적용돼요</p>`
      + friends.map(f => `<div class="item"><div><b>${esc(f.name)}</b><span class="muted">${f.likes.length ? '👍 ' + f.likes.join(', ') : ''} ${f.dislikes.length ? '🙅 ' + f.dislikes.join(', ') : ''}</span></div><div><button class="chip" data-edit="${f.id}">수정</button> <button class="x" data-delf="${f.id}">✕</button></div></div>`).join('')
      + `<div class="row"><button class="btn main" data-edit="new">＋ 친구 추가</button></div>`;
  },
  edit() {
    const f = S.editing;
    const chips = (field) => TAG_NAMES.map(t => `<button class="chip ${f[field].includes(t) ? 'on' : ''}" data-ftag="${field}" data-t="${t}">${t}</button>`).join('');
    return `<h2>${f.id ? '친구 수정' : '친구 추가'}</h2><div class="label">이름</div><input class="txt" id="fname" value="${esc(f.name)}" placeholder="예: 민수">`
      + `<div class="label">👍 좋아하는 것</div><div class="chips">${chips('likes')}</div>`
      + `<div class="label">🙅 싫어하는 것 / 알레르기 (항상 제외)</div><div class="chips">${chips('dislikes')}</div>`
      + `<div class="row"><button class="btn" data-tabgo="friends">취소</button><button class="btn main" data-savef>저장</button></div>`;
  },
  black() {
    return `<h2>🚫 블랙리스트</h2><p class="sub">여기 있는 곳은 가챠에 다시 안 나와요 (나만 적용)</p>`
      + (blacklist.map(b => `<div class="item"><b>${esc(b.name)}</b><button class="chip" data-unban="${esc(b.id)}">해제</button></div>`).join('') || '<p class="muted">아직 없어요. 결과 카드의 "🚫 안 가"로 추가할 수 있어요.</p>');
  },
  settings() {
    const seg = (key, vals) => `<div class="seg">${vals.map(([v, l]) => `<button class="${settings[key] === v ? 'on' : ''}" data-setting="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
    return `<h2>⚙️ 설정</h2>`
      + `<div class="label">기본 이동 거리</div>` + seg('mode', Object.entries(TRAVEL).map(([k, v]) => [k, v.label]))
      + `<div class="label">한 번에 추천할 개수</div>` + seg('count', [[3, '3곳'], [4, '4곳'], [5, '5곳']])
      + `<div class="label">다시 뽑기 기회</div>` + seg('rerolls', [[2, '2번'], [3, '3번']])
      + `<p class="muted">친구·블랙리스트·설정은 이 기기(브라우저)에만 저장돼요.<br>지도·장소 데이터: 카카오맵</p>`;
  },
};

function render() {
  if (!map) return;
  $body.innerHTML = S.tab === 'gacha' ? VIEWS[S.step]() : TABS[S.tab]();
  $body.scrollTop = 0;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === (S.tab === 'edit' ? 'friends' : S.tab)));
}

// ---------- 가챠 ----------
async function roll() {
  S.step = 'loading'; render();
  const started = Date.now();
  try {
    const places = await fetchPlaces(S.purpose, S.origin, TRAVEL[settings.mode].radius);
    const { excludes, likes } = collectPrefs();
    S.seen = new Set();
    S.cands = scoreCandidates(places, { origin: S.origin, originLabel: S.originLabel, mode: settings.mode, who: S.who, purpose: S.purpose, budget: S.budget, excludes, likes, indoorOnly: S.indoorOnly, now: new Date(), blacklist: new Set(blacklist.map(b => b.id)), seen: S.seen });
    S.total = S.cands.length;
    S.rerollsLeft = settings.rerolls;
    await new Promise(r => setTimeout(r, Math.max(0, 1000 - (Date.now() - started)))); // 두근두근 연출
    draw();
  } catch (e) {
    toast('장소를 불러오지 못했어요. 다시 시도해주세요'); S.step = 'filter'; render();
  }
}
function draw() {
  S.shown = gacha(S.cands, settings.count);
  S.shown.forEach(c => S.seen.add(c.place.id));
  S.cands = S.cands.filter(c => !S.seen.has(c.place.id));
  S.step = 'result'; render(); drawMarkers();
}
function drawMarkers() {
  clearLayer();
  if (S.multi) drawStarts();
  const b = new kakao.maps.LatLngBounds();
  b.extend(LL(S.origin));
  S.shown.forEach((c, i) => {
    overlay(c.place, 'pin', i + 1, () => { if (snapName === 'peek') snap('half'); document.querySelector(`[data-focus="${i}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
    b.extend(LL(c.place));
  });
  if (S.shown.length) map.setBounds(b, 90, 40, SNAPS[snapName]() + 30, 40);
}

// ---------- 이벤트 (위임) ----------
$body.addEventListener('click', e => {
  const t = e.target.closest('button, .card');
  if (!t) return;
  const d = t.dataset;
  if (d.set) { S[d.set] = d.val; if (d.set === 'who' && d.val !== 'friends') S.picked.clear(); return render(); }
  if (d.mode) { settings.mode = d.mode; store.set('settings', settings); setOrigin(S.origin, S.originLabel); return render(); }
  if (d.multi) { S.multi = d.multi === '1'; if (!S.multi) { S.starts = []; clearLayer(); } return render(); }
  if (d.rmstart) { S.starts.splice(+d.rmstart, 1); refreshStarts(); return render(); }
  if (d.pick) { S.picked.has(d.pick) ? S.picked.delete(d.pick) : S.picked.add(d.pick); S.people = Math.max(S.people, S.picked.size + 1); return render(); }
  if (d.people) { S.people = Math.min(20, Math.max(2, S.people + +d.people)); return render(); }
  if (d.today) { S.today.has(d.today) ? S.today.delete(d.today) : S.today.add(d.today); return render(); }
  if ('indoor' in d) { S.indoorOnly = !S.indoorOnly; return render(); }
  if (d.go === 'next') { S.step = STEPS[STEPS.indexOf(S.step) + 1]; if (S.step === 'who') showPoint(S.origin); return render(); }
  if (d.go === 'back') { S.step = STEPS[STEPS.indexOf(S.step) - 1]; return render(); }
  if (d.go === 'roll') return roll();
  if (d.go === 'reroll') { S.rerollsLeft--; return draw(); }
  if (d.go === 'filter') { S.step = 'filter'; return render(); }
  if (d.go === 'restart') { Object.assign(S, { step: 'where', who: null, purpose: null, budget: null, today: new Set(), indoorOnly: false, shown: [] }); S.picked.clear(); clearLayer(); if (S.multi) drawStarts(); return render(); }
  if (d.ban) {
    const c = S.shown[+d.ban];
    if (!confirm(`'${c.place.name}'을(를) 블랙리스트에 넣을까요?\n다음부터 가챠에 안 나와요.`)) return;
    blacklist.push({ id: c.place.id, name: c.place.name }); store.set('black', blacklist);
    S.shown.splice(+d.ban, 1); render(); drawMarkers(); return toast('블랙리스트에 추가했어요');
  }
  if (d.focus) { if (!e.target.closest('a')) map.panTo(LL(S.shown[+d.focus].place)); return; }
  // 탭 화면
  if (d.tabgo) { S.tab = d.tabgo; return render(); }
  if (d.edit) { const f = friends.find(x => x.id === d.edit); S.editing = f ? structuredClone(f) : { id: '', name: '', likes: [], dislikes: [] }; S.tab = 'edit'; return render(); }
  if (d.ftag) {
    S.editing.name = $('fname').value;
    const f = S.editing, other = d.ftag === 'likes' ? 'dislikes' : 'likes', arr = f[d.ftag];
    arr.includes(d.t) ? arr.splice(arr.indexOf(d.t), 1) : (arr.push(d.t), f[other] = f[other].filter(x => x !== d.t));
    return render();
  }
  if ('savef' in d) {
    const f = S.editing; f.name = $('fname').value.trim();
    if (!f.name) return toast('이름을 입력해주세요');
    if (f.id) friends = friends.map(x => x.id === f.id ? f : x); else friends.push({ ...f, id: Date.now().toString(36) });
    store.set('friends', friends); S.tab = 'friends'; return render();
  }
  if (d.delf) { if (!confirm('이 친구를 삭제할까요?')) return; friends = friends.filter(x => x.id !== d.delf); S.picked.delete(d.delf); store.set('friends', friends); return render(); }
  if (d.unban) { blacklist = blacklist.filter(b => b.id !== d.unban); store.set('black', blacklist); return render(); }
  if (d.setting) { settings[d.setting] = isNaN(d.v) ? d.v : +d.v; store.set('settings', settings); setOrigin(S.origin, S.originLabel); return render(); }
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab; if (snapName === 'peek') snap('half'); render();
  if (S.tab === 'gacha' && S.step === 'result') drawMarkers();
});
</script>
</body>
</html>
